name: config-probe

on:
  push:
    branches:
      - blu_spark-17-next-susfs
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blu_spark-17-next-susfs
          fetch-depth: 1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev clang lld llvm python3
      - run: make O=out ARCH=arm64 LLVM=1 blu_spark_defconfig
      - name: Show stack/LTO config
        run: |
          grep -E "STACKPROTECTOR|CC_HAVE_STACKPROTECTOR_SYSREG|LTO|CC_IS_CLANG|LD_IS_LLD" out/.config
      - uses: actions/upload-artifact@v4
        with:
          name: a17-config
          path: out/.config