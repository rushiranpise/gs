name: kernel-build

on:
  push:
    branches:
      - blu_spark-16-next-susfs
  workflow_dispatch:

jobs:
  build:
    name: build (blu_spark-16-next-susfs)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blu_spark-16-next-susfs
          fetch-depth: 1
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison cpio flex kmod libelf-dev libssl-dev clang lld llvm python3
          clang --version | head -1
      - name: Configure
        run: |
          # A16's Makefile defaults CROSS_COMPILE to an aosp aarch64-linux-android
          # prefix, so clang targets aarch64-linux-android and drops the sysreg
          # per-task stack guard -> undefined __stack_chk_guard at link.
          make O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- blu_spark_defconfig
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS=" out/.config
      - name: Build kernel image
        run: |
          make O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image-A16
          path: out/arch/arm64/boot/Image
          if-no-files-found: error