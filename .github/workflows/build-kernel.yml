name: kernel-build

on:
  push:
    branches:
      - blu_spark-16-next-susfs
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch:
          - blu_spark-16-next-susfs
          - blu_spark-16
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 1
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison cpio flex kmod libelf-dev libssl-dev clang lld llvm python3
          clang --version | head -1
      - name: Configure (blu_spark defconfig, LTO disabled for CI)
        run: |
          make O=out ARCH=arm64 LLVM=1 blu_spark_defconfig
          # A16-line kernel fails at the full-LTO link with the sysreg
          # stack guard on non-AOSP clang; disable LTO to isolate the port.
          ./scripts/config --file out/.config -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          grep -E "CONFIG_KSU=|CONFIG_KSU_SUSFS=|CONFIG_LTO=" out/.config
      - name: Build kernel image
        run: |
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image
      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ matrix.branch }}
          path: out/arch/arm64/boot/Image
          if-no-files-found: ignore